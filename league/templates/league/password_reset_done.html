{% extends 'league/base.html' %}
{% block title %}Check your email{% endblock %}
{% block content %}
<section class="auth-card card centered">
  <h1>Check your email</h1>
  <p>If an account exists for that email, a reset link has been sent.</p>
  <p class="muted">The link is time-limited. Check your spam folder if it does not arrive soon.</p>
  <a class="button ghost" href="{% url 'login' %}">Back to login</a>
</section>
{% endblock %}
