{% extends 'league/base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Reset your password</h1>
  <p class="muted">Enter the email address associated with your QueueUp account.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button primary" type="submit">Send reset link</button>
  </form>
  <p><a href="{% url 'login' %}">Back to login</a></p>
</section>
{% endblock %}
