{% if user_obj.profile.picture %}<img class="user-avatar {{ avatar_class|default:'avatar-sm' }}" src="{{ user_obj.profile.picture.url }}" alt="{{ user_obj.first_name|default:user_obj.username }} profile picture">{% else %}<span class="avatar-fallback {{ avatar_class|default:'avatar-sm' }}" aria-hidden="true">{{ user_obj.first_name|default:user_obj.username|slice:':1'|upper }}</span>{% endif %}
